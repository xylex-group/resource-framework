name: Package Readiness

on:
  pull_request:
    paths:
      - "adapters/**"
      - "components/**"
      - "constructors/**"
      - "demo/**"
      - "drizzle/**"
      - "handlers/**"
      - "hooks/**"
      - "lightbox/**"
      - "notifications/**"
      - "registries/**"
      - "renderers/**"
      - "templating/**"
      - "tests/**"
      - "types/**"
      - "utils/**"
      - "index.ts"
      - "resource-types.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "rollup.config.mjs"
      - ".github/workflows/package-readiness.yml"
  push:
    branches:
      - main
    paths:
      - "adapters/**"
      - "components/**"
      - "constructors/**"
      - "demo/**"
      - "drizzle/**"
      - "handlers/**"
      - "hooks/**"
      - "lightbox/**"
      - "notifications/**"
      - "registries/**"
      - "renderers/**"
      - "templating/**"
      - "tests/**"
      - "types/**"
      - "utils/**"
      - "index.ts"
      - "resource-types.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "rollup.config.mjs"
      - ".github/workflows/package-readiness.yml"
  workflow_dispatch:

concurrency:
  group: package-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run prepack pipeline
        run: npm run prepack

      - name: Create package tarball
        run: npm pack --ignore-scripts

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-tarball
          path: "*.tgz"
