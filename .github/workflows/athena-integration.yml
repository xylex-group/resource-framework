name: Athena Integration

on:
  workflow_dispatch:

concurrency:
  group: athena-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ATHENA_INTEGRATION_BASE_URL: ${{ secrets.ATHENA_INTEGRATION_BASE_URL }}
      ATHENA_INTEGRATION_API_KEY: ${{ secrets.ATHENA_INTEGRATION_API_KEY }}
      ATHENA_INTEGRATION_USER_ID: ${{ secrets.ATHENA_INTEGRATION_USER_ID }}
      ATHENA_INTEGRATION_COMPANY_ID: ${{ secrets.ATHENA_INTEGRATION_COMPANY_ID }}
      ATHENA_INTEGRATION_ORGANIZATION_ID: ${{ secrets.ATHENA_INTEGRATION_ORGANIZATION_ID }}
      ATHENA_INTEGRATION_TABLE: ${{ secrets.ATHENA_INTEGRATION_TABLE }}
      ATHENA_INTEGRATION_ID_COLUMN: ${{ secrets.ATHENA_INTEGRATION_ID_COLUMN }}
      ATHENA_INTEGRATION_INSERT_BODY_JSON: ${{ secrets.ATHENA_INTEGRATION_INSERT_BODY_JSON }}
      ATHENA_INTEGRATION_UPDATE_BODY_JSON: ${{ secrets.ATHENA_INTEGRATION_UPDATE_BODY_JSON }}
      ATHENA_INTEGRATION_SELECT_COLUMNS: ${{ secrets.ATHENA_INTEGRATION_SELECT_COLUMNS }}
      ATHENA_INTEGRATION_UPLOAD_PROJECT_ID: ${{ secrets.ATHENA_INTEGRATION_UPLOAD_PROJECT_ID }}
      ATHENA_INTEGRATION_UPLOAD_OBJECT_PATH: ${{ secrets.ATHENA_INTEGRATION_UPLOAD_OBJECT_PATH }}
      ATHENA_INTEGRATION_UPLOAD_BUCKET: ${{ secrets.ATHENA_INTEGRATION_UPLOAD_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate integration secrets
        run: |
          missing=0
          for key in \
            ATHENA_INTEGRATION_BASE_URL \
            ATHENA_INTEGRATION_API_KEY \
            ATHENA_INTEGRATION_USER_ID \
            ATHENA_INTEGRATION_COMPANY_ID \
            ATHENA_INTEGRATION_ORGANIZATION_ID \
            ATHENA_INTEGRATION_TABLE \
            ATHENA_INTEGRATION_ID_COLUMN \
            ATHENA_INTEGRATION_INSERT_BODY_JSON \
            ATHENA_INTEGRATION_UPDATE_BODY_JSON \
            ATHENA_INTEGRATION_UPLOAD_PROJECT_ID \
            ATHENA_INTEGRATION_UPLOAD_OBJECT_PATH \
            ATHENA_INTEGRATION_UPLOAD_BUCKET
          do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: $key"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run Athena integration tests
        run: npm run test:integration
